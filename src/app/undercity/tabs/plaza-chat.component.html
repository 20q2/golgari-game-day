<button class="chat-fab" type="button" (click)="toggle()" aria-label="Open chat">
  <mat-icon class="mi">chat_bubble</mat-icon>
  @if (!open() && unread() > 0) {
    <span class="chat-badge">{{ unread() > 9 ? '9+' : unread() }}</span>
  }
</button>

@if (open()) {
  <div class="chat-backdrop" (click)="close()"></div>
  <section class="chat-panel" aria-label="Undercity chat">
    <header class="chat-head">
      <mat-icon class="mi">chat_bubble</mat-icon>
      <h3>Undercity Chat</h3>
      <button class="chat-close" type="button" (click)="close()" aria-label="Close chat">
        <mat-icon class="mi">close</mat-icon>
      </button>
    </header>

    <div class="chat-list" #chatList>
      @for (m of messages(); track m.id) {
        <div class="chat-msg" [class.own]="m.userId === store.ownUserId">
          @if (avatarUrl(m.userId); as url) {
            <img class="chat-avatar" [src]="url" alt="" />
          } @else {
            <mat-icon class="mi chat-avatar-fallback">person</mat-icon>
          }
          <div class="chat-body">
            <div class="chat-meta">
              <span class="chat-name">{{ m.username }}</span>
              <span class="chat-time">{{ timeOf(m) }}</span>
            </div>
            <div class="chat-text">{{ m.text }}</div>
          </div>
        </div>
      } @empty {
        <div class="chat-empty">Nothing yet — say hi to the swamp.</div>
      }
    </div>

    @if (errorMsg(); as err) {
      <div class="chat-error">{{ err }}</div>
    }

    <div class="chat-compose">
      <input
        class="chat-input"
        type="text"
        [maxlength]="CHAT_MAX"
        placeholder="Message the Undercity…"
        [(ngModel)]="draft"
        (keyup.enter)="send()"
      />
      <button
        class="chat-send"
        type="button"
        [disabled]="busy() || !draft().trim()"
        (click)="send()"
        aria-label="Send message"
      >
        <mat-icon class="mi">send</mat-icon>
      </button>
    </div>
  </section>
}
